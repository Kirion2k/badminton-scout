# Local development database only. Never point this at shared or production data.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scout-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-scout}
    # loopback only; 5433 so a natively installed Postgres on 5432 is never hit by mistake
    ports: ["127.0.0.1:${POSTGRES_PORT:-5433}:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
