[project]
name = "scout"
version = "0.1.0"
description = "Badminton Scout backend: API, ingestion and analytics"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.120",
  "uvicorn[standard]>=0.38",
  "pydantic>=2.12",
  "pydantic-settings>=2.11",
  "sqlalchemy>=2.0.44",
  "alembic>=1.17",
  "psycopg[binary]>=3.2",
  "api-anything",
]

[project.scripts]
scout = "scout.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "httpx>=0.28",
  "ruff>=0.14",
  "pyright>=1.1.407",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# live tests reach real websites: never part of the default run or CI (`make api-anything-smoke`)
addopts = "-q --strict-markers -m 'not live'"
markers = [
  "db: needs the local PostgreSQL from compose.yaml (make db-up)",
  "live: calls a real external site through API Anything; run explicitly only",
  "published: runs with the ADR-0010 policy (junior and para events served)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"migrations/versions/*" = ["E501"]  # generated by alembic autogenerate
"src/scout/seed.py" = ["E501"]  # fixture table: one match per line reads better

[tool.pyright]
include = ["src", "tests", "migrations"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.uv.sources]
api-anything = { git = "https://github.com/goodnight000/api-anything", subdirectory = "python", rev = "985ae8f65f4c4918f24080bd7dbaf51fe92e6bf6" }
